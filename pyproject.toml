[project]
name = "galaxeye-slice"
version = "1.0.0"
description = "GalaxEye Tile Classification — Thin Slice"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "onnxruntime==1.24.4",
    "onnx==1.23.0",
    "pillow==12.1.1",
    "numpy==2.4.4",
    "python-multipart==0.0.32",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
train = [
    "torch>=2.0.0",
    "onnxscript>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
